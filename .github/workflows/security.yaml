name: Secret detection
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: python -m pip install detect-secrets==1.5.0
      - run: gitleaks git --redact --config .gitleaks.toml --log-opts=--all
      - run: git ls-files -z | xargs -0 -r detect-secrets-hook
