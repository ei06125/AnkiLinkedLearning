name: Tag release

on:
  push:
    branches: [main]
    paths:
      - Configs/manifest.json
      - package.json
      - package-lock.json
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version tag
        run: |
          set -euo pipefail

          version="$(jq --raw-output '.version' package.json)"
          manifest_version="$(jq --raw-output '.version' Configs/manifest.json)"
          lock_version="$(jq --raw-output '.packages[""].version' package-lock.json)"
          [[ "$version" == "$manifest_version" ]]
          [[ "$version" == "$lock_version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "${tag} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Release ${version}"
          git push origin "$tag"
