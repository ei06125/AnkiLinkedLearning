minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]
exclude: '^(\.build/|\.playwright-mcp/|node_modules/)'
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Gitleaks staged changes
        entry: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-history
        name: Gitleaks full history
        entry: gitleaks git --redact --config .gitleaks.toml --log-opts=--all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: detect-secrets
        name: Detect secrets in changed files
        entry: detect-secrets-hook
        language: system
      - id: repository-anonymity
        name: Reject absolute home paths and machine identity
        entry: node Tools/scripts/check-anonymity.mjs
        language: system
      - id: verify
        name: Check, test, and build extension
        entry: npm run verify
        language: system
        pass_filenames: false
        always_run: true
